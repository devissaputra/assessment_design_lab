<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Assessment Design Lab synthetic demo snapshot</title>
<desc id="desc">Synthetic example showing alpha and item diagnostics produced by the current code.</desc>
<rect width="1200" height="300" rx="24" fill="#111827"/>
<text x="52" y="48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f9fafb">Synthetic demo snapshot</text>
<text x="52" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aeb8c5">Nine synthetic respondents · four binary items · not an empirical psychometric result.</text>

<rect x="52" y="112" width="260" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="70" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Cronbach alpha</text>
<text x="70" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">0.46</text>

<rect x="330" y="112" width="260" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="348" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Item 1</text>
<text x="348" y="172" font-family="Arial" font-size="15" font-weight="600" fill="#f3f4f6">difficulty 0.56 · discr. 0.55</text>

<rect x="608" y="112" width="260" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="626" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Item 2</text>
<text x="626" y="172" font-family="Arial" font-size="15" font-weight="600" fill="#f3f4f6">discr. 0.15 · review flag</text>

<rect x="886" y="112" width="262" height="108" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="904" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Item 3</text>
<text x="904" y="172" font-family="Arial" font-size="15" font-weight="600" fill="#f3f4f6">discr. 0.10 · review flag</text>

<text x="52" y="260" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8995a5">Run: python scripts/run_demo.py · two items trigger the default low-discrimination review prompt.</text>
